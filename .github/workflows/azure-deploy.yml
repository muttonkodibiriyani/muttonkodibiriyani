name: AIC — Azure CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

env:
  PROJECT_NAME: aic

jobs:
  # ------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------------
  codeql-scan:
    name: CodeQL — JavaScript security-extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended,security-and-quality
      - name: Run analysis
        uses: github/codeql-action/analyze@v3
        with: { category: '/language:javascript' }

  # ------------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: npm audit (best effort)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high || echo "Audit warnings found — review required"
          else
            echo "No package.json — skipping npm audit"
          fi

  # ------------------------------------------------------------------------
  validate:
    name: Validate Bicep + HTML
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Bicep build (production)
        run: az bicep build --file infra/main.bicep
      - name: Bicep lint
        run: az bicep lint --file infra/main.bicep || true
      - name: Validate staticwebapp.config.json
        run: |
          python -c "import json,sys; json.load(open('staticwebapp.config.json')); print('SWA config OK')"
      - name: HTML smoke check
        run: |
          for f in *.html; do
            if grep -q "<html" "$f" && grep -q "</html>" "$f"; then echo "OK: $f"; else echo "MALFORMED: $f"; exit 1; fi
          done

  # ------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → staging
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [validate, codeql-scan, dependency-audit]
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure (Bicep)
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          region: uaenorth
          template: infra/main.bicep
          parameters: infra/parameters/staging.bicepparam
          deploymentName: aic-staging-${{ github.run_id }}
      - name: Inject env-config.js
        run: |
          cat > env-config.js <<EOF
          window.__AIC_ENV = {
            AZURE_CLIENT_ID: '${{ secrets.AZURE_CLIENT_ID }}',
            AZURE_TENANT_ID: '${{ secrets.AZURE_TENANT_ID }}',
            APIM_BASE_URL:   '${{ secrets.APIM_BASE_URL_STAGING }}',
            APPLICATIONINSIGHTS_CONNECTION_STRING: '${{ secrets.APPINSIGHTS_CONNSTR_STAGING }}'
          };
          EOF
      - name: Deploy SWA content
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: ''
          output_location: ''
          skip_app_build: true
      - name: Smoke test (HTTP 200 + headers)
        run: |
          URL="${{ steps.deploy.outputs.static_web_app_url }}"
          curl -sSf -o /dev/null -w "%{http_code}\n" "$URL"
          curl -sSI "$URL" | grep -i "x-frame-options" || (echo "Missing security header" && exit 1)

  # ------------------------------------------------------------------------
  deploy-preview:
    name: PR preview
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          skip_app_build: true

  # ------------------------------------------------------------------------
  close-preview:
    name: Close PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN_STAGING }}
          action: close

  # ------------------------------------------------------------------------
  deploy-production:
    name: Deploy → production
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    needs: [validate, codeql-scan, secret-scan, dependency-audit]
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure (Bicep)
        uses: azure/arm-deploy@v1
        with:
          scope: subscription
          region: uaenorth
          template: infra/main.bicep
          parameters: infra/parameters/production.bicepparam
          deploymentName: aic-prod-${{ github.run_id }}
      - name: Inject env-config.js
        run: |
          cat > env-config.js <<EOF
          window.__AIC_ENV = {
            AZURE_CLIENT_ID: '${{ secrets.AZURE_CLIENT_ID }}',
            AZURE_TENANT_ID: '${{ secrets.AZURE_TENANT_ID }}',
            APIM_BASE_URL:   '${{ secrets.APIM_BASE_URL_PROD }}',
            APPLICATIONINSIGHTS_CONNECTION_STRING: '${{ secrets.APPINSIGHTS_CONNSTR_PROD }}'
          };
          EOF
      - name: Deploy SWA content
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: ''
          output_location: ''
          skip_app_build: true
      - name: Smoke tests
        run: |
          URL="${{ steps.deploy.outputs.static_web_app_url }}"
          echo "Smoke testing $URL"
          STATUS=$(curl -sSf -o /dev/null -w "%{http_code}" "$URL")
          [ "$STATUS" = "200" ] || (echo "Bad status $STATUS"; exit 1)
          curl -sSI "$URL" | grep -i "strict-transport-security" || (echo "HSTS missing"; exit 1)
          curl -sSI "$URL" | grep -i "content-security-policy" || (echo "CSP missing"; exit 1)
      - name: Open rollback issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production deployment failed — run ${{ github.run_id }}`,
              body: `Production deployment failed. Investigate and execute rollback procedure documented in AZURE-DEPLOY.md §13.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
              labels: ['rollback','sev-1','production']
            });
