<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="robots" content="noindex, nofollow" />
  <title>403 — Access Denied</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/design-system.css" />
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<main class="error-page">
  <div class="err-icon"><i class="fas fa-lock"></i></div>
  <h1>403 — Access Denied</h1>
  <p>Your current role does not permit access to this page. If you believe this is an error, please contact the platform administrator.</p>
  <div id="role-display" class="text-muted text-sm mb-md"></div>
  <div class="flex gap-sm">
    <a href="index.html" class="btn btn-primary"><i class="fas fa-house"></i> Return to Home</a>
    <a href="mailto:aic-support@alshaya.com?subject=AIC%20Access%20Request" class="btn btn-secondary"><i class="fas fa-envelope"></i> Request Access</a>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/security.js"></script>
<script>
(function () {
  const u = AIC_DB.getUser();
  if (u) {
    document.getElementById('role-display').textContent = 'Signed in as ' + u.name + ' · Role: ' + (u.role || '').replace(/_/g, ' ');
  }
  AIC_SEC.audit('ACCESS_DENIED_VIEW', { user: u ? u.id : null, referrer: document.referrer }, 'WARN');
})();
</script>

</body>
</html>
