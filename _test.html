<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>AIC Tests</title></head><body><main class="page-body"><section class="card"><h1>AIC Automated Demo Tests</h1><pre id="out"></pre></section></main><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script>'use strict';(async()=>{const log=(ok,msg)=>out.textContent+=(ok?'OK ':'FAIL ')+msg+'\n';try{localStorage.removeItem('aic_db_version');AIC_DB.init();const initiatives=await AIC_DB.getInitiatives(),users=await AIC_DB.getUsers();log(initiatives.length===5,'DB initializes with 5 initiatives');log(users.length===7,'DB has 7 users across all roles');for(const u of users){AIC_DB.setUser(u);log(!!AIC_DB.getUser(),'Authentication works for '+u.role)}const s=await AIC_DB.getPortfolioSummary();log(s.initiativeCount===5,'Portfolio summary computes correctly');log(AIC_DB.computeGatekeeperScore({d1:{score:76,weight:30},d2:{score:84,weight:25},d3:{score:71,weight:20},d4:{score:88,weight:15},d5:{score:74,weight:10}})===79,'Gatekeeper score weighted calculation');const c=await AIC_DB.createInitiative({title:'Test Initiative',domain:'Other',status:'Submitted',budgetRequested:1});log(!!c.id,'Initiative CRUD operations');const d=AIC_DB.saveDraft({title:'Draft',completion:50});log(AIC_DB.getDraft(d.id).title==='Draft','Draft save and resume');AIC_DB.addAuditEvent({action:'TEST',severity:'INFO'});log(AIC_DB.getAuditLog().length>0,'Audit log writes');const nu=await AIC_DB.createUser({name:'Admin Two',email:'admin2@alshaya.com'});await AIC_DB.updateUser(nu.id,{title:'Owner'});await AIC_DB.deleteUser(nu.id);log(true,'User CRUD operations');log(AIC_SEC.canAccess({role:'Platform_Admin'},['Platform_Admin']),'Role-based access: Platform_Admin sees everything');log(!AIC_SEC.canAccess({role:'Initiative_Submitter'},['Platform_Admin']),'Role-based access: Submitter cannot see admin page');}catch(e){log(false,e.stack)}})();</script></body></html>
