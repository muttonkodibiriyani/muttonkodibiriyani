<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>Admin Console</title></head><body><nav class="sidebar"></nav><div class="main-wrap"><header class="top-bar"><h1>Platform Admin Console</h1><button class="btn btn-secondary" onclick="render(tab)">Refresh</button></header><main class="page-body"><section class="card"><div class="tabs"><button class="tab active" data-tab="users">User Management</button><button class="tab" data-tab="perms">Permission Matrix</button><button class="tab" data-tab="data">Data Management</button><button class="tab" data-tab="audit">Audit Log</button><button class="tab" data-tab="health">System Health</button></div><div id="body"></div></section></main></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script> 'use strict';let tab='users',dataCache=[];async function render(t='users'){tab=t;if(t==='users'){const u=await AIC_DB.getUsers();body.innerHTML=AIC_SEC.sanitize(`<button class="btn btn-primary" onclick="editUser()">Add User</button><table><thead><tr><th>User</th><th>Email</th><th>Role</th><th>Department</th><th>Title</th><th>Status</th><th></th></tr></thead><tbody>${u.map(x=>`<tr><td><span class="avatar">${x.initials}</span> ${x.name}</td><td>${x.email}</td><td><span class="badge badge-purple">${x.role}</span></td><td>${x.department}</td><td>${x.title}</td><td><span class="badge ${x.active?'badge-success':'badge-danger'}">${x.active?'Active':'Disabled'}</span></td><td><button class="btn btn-secondary" onclick="editUser('${x.id}')">Edit</button> <button class="btn btn-danger" onclick="delUser('${x.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`)}if(t==='perms'){const roles=Object.keys(AIC_SEC.ROLE_HIERARCHY),perms=['Submit','Review','Approve','Admin','Read Portfolio'];body.innerHTML=AIC_SEC.sanitize(`<table><thead><tr><th>Role</th>${perms.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${roles.map(r=>`<tr><td>${r}</td>${perms.map((p,i)=>`<td><input type="checkbox" ${AIC_SEC.ROLE_HIERARCHY[r]>=[40,60,80,100,20][i]?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table><button class="btn btn-success">Save changes</button>`)}if(t==='data'){const s=await AIC_DB.getPortfolioSummary(),u=await AIC_DB.getUsers();dataCache=await AIC_DB.getInitiatives();body.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-3"><div class="card"><h3>DB version</h3><p>${AIC_CONFIG.app.version}</p></div><div class="card"><h3>Initiatives</h3><p>${s.initiativeCount}</p></div><div class="card"><h3>Users</h3><p>${u.length}</p></div></div><button class="btn btn-secondary" onclick="exportToCsv('aic-data.csv',dataCache)">Export All Data</button> <button class="btn btn-danger" onclick="localStorage.removeItem('aic_db_version');AIC_DB.init();render('data')">Reset to Sample Data</button><h3>Feature Flags</h3>${Object.entries(AIC_CONFIG.features).map(([k,v])=>`<label>${k}<input type="checkbox" ${v?'checked':''}></label>`).join('')}<h3>Gatekeeper thresholds</h3><label>Pass<input type="range" value="75"></label><label>Conditional<input type="range" value="60"></label>`)}if(t==='audit'){const a=AIC_DB.getAuditLog(500);body.innerHTML=AIC_SEC.sanitize(`<button class="btn btn-secondary" onclick="exportToCsv('audit.csv',AIC_DB.getAuditLog())">Export to CSV</button><table><thead><tr><th>Timestamp</th><th>Action</th><th>Severity</th><th>User</th><th>URL</th><th>Data</th></tr></thead><tbody>${a.map(e=>`<tr><td>${formatDate(e.timestamp,{dateStyle:'short',timeStyle:'medium'})}</td><td>${e.action}</td><td><span class="badge ${e.severity==='CRITICAL'?'badge-danger':e.severity==='WARN'?'badge-warning':'badge-info'}">${e.severity}</span></td><td>${e.user}</td><td>${e.href||''}</td><td><details><summary>view</summary><pre>${JSON.stringify(e.data)}</pre></details></td></tr>`).join('')}</tbody></table>`)}if(t==='health'){body.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-4">${['APIM','Cosmos','Auth','App Insights'].map(x=>`<div class="stat-card"><div class="stat-label">${x}</div><div class="stat-value"><span class="badge badge-success">Demo OK</span></div><div class="stat-sub">Last check ${new Date().toLocaleTimeString()}</div></div>`).join('')}</div><button class="btn btn-primary" onclick="showToast('Health checks completed','success')">Run Health Check</button><pre>${JSON.stringify(AIC_CONFIG.features,null,2)}</pre>`)}}async function editUser(id){const users=await AIC_DB.getUsers(),u=users.find(x=>x.id===id)||{role:'Platform_Admin',active:true};const m=document.createElement('div');m.className='modal-backdrop';m.innerHTML=AIC_SEC.sanitize(`<div class="modal"><h2>${id?'Edit':'Add'} user</h2><label>Name<input id="un" value="${u.name||''}"></label><label>Email<input id="ue" type="email" value="${u.email||''}"></label><label>Role<select id="ur">${Object.values(AIC_CONFIG.roles).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></label><label>Department<input id="ud" value="${u.department||''}"></label><label>Title<input id="ut" value="${u.title||''}"></label><button id="saveU" class="btn btn-success">Save</button></div>`);document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};saveU.onclick=async()=>{if(!AIC_SEC.validate.email(ue.value))return showToast('Valid email required','error');const d={name:un.value,email:ue.value,role:ur.value,department:ud.value,title:ut.value,active:true};id?await AIC_DB.updateUser(id,d):await AIC_DB.createUser(d);m.remove();render('users')}}async function delUser(id){if(await showConfirm('Delete user','Remove this portal user?','Delete')){await AIC_DB.deleteUser(id);render('users')}}document.addEventListener('click',e=>{if(e.target.matches('.tab')){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.tab)}});initPage({allowedRoles:['Platform_Admin'],onReady:()=>{render();setInterval(()=>tab==='audit'&&render('audit'),30000)}});</script></body></html>
