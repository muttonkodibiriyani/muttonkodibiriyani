<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIC Logo System Board</title>
  <style>
    body { margin: 0; background: #eef1f5; font-family: Inter, Arial, sans-serif; color: #0f172a; }
    .board { width: 1400px; margin: 28px auto; background: #fff; border: 1px solid #dbe1ea; border-radius: 16px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); padding: 24px; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
    .head strong { letter-spacing: 0.03em; }
    .swatches { display: flex; gap: 8px; }
    .swatch { width: 42px; height: 26px; border: 1px solid #d1d5db; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .item h3 { margin: 0 0 10px; font-size: 24px; font-weight: 600; }
    .pane { border: 1px solid #e2e8f0; border-radius: 12px; padding: 10px; background: #f8fafc; }
    .pane img { width: 100%; border-radius: 8px; display: block; }
    .icon-pane { display: flex; align-items: center; justify-content: center; min-height: 220px; background: #fff; }
    .icon-pane img { width: 168px; height: 168px; }
  </style>
</head>
<body>
  <div class="board">
    <div class="head">
      <div><strong>ALSHAYA INVESTMENT COUNCIL</strong> &nbsp;|&nbsp; BRAND IDENTITY PRESENTATION</div>
      <div class="swatches">
        <div class="swatch" style="background:#071B46;"></div>
        <div class="swatch" style="background:#1D4ED8;"></div>
        <div class="swatch" style="background:#ffffff;"></div>
        <div class="swatch" style="background:linear-gradient(90deg,#d1d5db,#f8fafc);"></div>
      </div>
    </div>
    <div class="grid">
      <div class="item">
        <h3>1) PRIMARY LOGO (On White)</h3>
        <div class="pane"><img src="aic-logo-primary.svg" alt="AIC primary logo"/></div>
      </div>
      <div class="item">
        <h3>2) REVERSED LOGO (On Dark Navy)</h3>
        <div class="pane"><img src="aic-logo-reversed.svg" alt="AIC reversed logo"/></div>
      </div>
      <div class="item">
        <h3>3) STANDALONE ICON</h3>
        <div class="pane icon-pane"><img src="aic-icon.svg" alt="AIC icon logo"/></div>
      </div>
      <div class="item">
        <h3>4) MONOCHROME VERSION</h3>
        <div class="pane"><img src="aic-logo-mono.svg" alt="AIC monochrome logo"/></div>
      </div>
    </div>
  </div>
</body>
</html>
