<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>CXO Dashboard</title></head><body><nav class="sidebar"></nav><div class="main-wrap"><header class="top-bar"><h1>Investment Committee Portfolio</h1><div><button class="btn btn-secondary" onclick="exportToCsv('initiatives.csv',data)">CSV Export</button><button class="btn btn-primary" onclick="openCouncil()">Council Score</button></div></header><main class="page-body"><section class="grid grid-4" id="stats"></section><section class="card"><button class="btn btn-secondary" onclick="view='table';render()">Table view</button> <button class="btn btn-secondary" onclick="view='kanban';render()">Kanban view</button><div id="portfolio" style="margin-top:16px"></div></section><section class="grid grid-2"><div class="card chart-box"><canvas id="budgetDomain"></canvas></div><div class="card chart-box"><canvas id="scoreDist"></canvas></div><div class="card chart-box"><canvas id="pipeline"></canvas></div><div class="card chart-box"><canvas id="stageBudget"></canvas></div></section></main></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script> 'use strict';let data=[],view='table';async function render(){data=await AIC_DB.getInitiatives();const s=await AIC_DB.getPortfolioSummary();stats.innerHTML=AIC_SEC.sanitize(`<div class="stat-card"><div class="stat-label">Active Portfolio</div><div class="stat-value">${s.activePortfolio}</div></div><div class="stat-card"><div class="stat-label">Total Committed Budget</div><div class="stat-value">${formatCurrency(s.totalApproved,'USD',true)}</div></div><div class="stat-card"><div class="stat-label">Budget Utilisation</div><div class="stat-value">${formatPct(s.utilisation,0)}</div></div><div class="stat-card"><div class="stat-label">Avg Council Score</div><div class="stat-value">${s.avgCouncil}</div></div>`);if(view==='kanban'){const cols=['Draft','Submitted','Validated','Approved','Closed'];portfolio.innerHTML=AIC_SEC.sanitize(`<div class="kanban">${cols.map(c=>`<div class="kanban-col"><h3>${c}</h3>${data.filter(x=>x.status===c).map(x=>`<div class="card"><strong>${x.title}</strong><p><span class="badge badge-purple">${x.domain}</span></p><p>${formatCurrency(x.budgetRequested,'USD',true)} | ${x.submittedBy}</p><a class="btn btn-secondary" href="initiative-detail.html?id=${x.id}">Open</a></div>`).join('')}</div>`).join('')}</div>`)}else portfolio.innerHTML=AIC_SEC.sanitize(`<table><thead><tr><th>Title</th><th>Status</th><th>Domain</th><th>Budget</th><th>GK</th><th>Council</th><th>Gate</th></tr></thead><tbody>${data.map(x=>`<tr><td>${x.title}</td><td><span class="badge ${statusClass(x.status)}">${x.status}</span></td><td>${x.domain}</td><td>${formatCurrency(x.budgetRequested,'USD',true)}</td><td>${x.gatekeeperScore??'-'}</td><td>${x.councilScore??'-'}</td><td><button class="btn btn-success" onclick="approveGate('${x.id}')">Approve Gate</button></td></tr>`).join('')}</tbody></table>`);charts()}function charts(){const group=k=>data.reduce((m,x)=>((m[x[k]]=m[x[k]]||[]).push(x),m),{}),bd=group('domain'),st=group('status');AIC_CHARTS.doughnut('budgetDomain',Object.keys(bd),Object.values(bd).map(a=>a.reduce((n,x)=>n+x.budgetRequested,0)),['#6366f1','#10b981','#f59e0b','#8b5cf6','#3b82f6']);AIC_CHARTS.bar('scoreDist',['<60','60-74','75+'],[{label:'Scores',data:[data.filter(x=>(x.gatekeeperScore||0)<60).length,data.filter(x=>(x.gatekeeperScore||0)>=60&&(x.gatekeeperScore||0)<75).length,data.filter(x=>(x.gatekeeperScore||0)>=75).length],backgroundColor:'#6366f1'}]);AIC_CHARTS.bar('pipeline',Object.keys(st),[{label:'Pipeline',data:Object.values(st).map(a=>a.length),backgroundColor:'#10b981'}]);AIC_CHARTS.bar('stageBudget',data.map(x=>x.id),[{label:'Spent',data:data.map(x=>x.budgetSpent||0),backgroundColor:'#ef4444'},{label:'Approved',data:data.map(x=>x.budgetApproved||0),backgroundColor:'#3b82f6'}])}async function openCouncil(){const opts=data.filter(x=>x.status==='Validated'||x.status==='Approved').map(x=>`<option value="${x.id}">${x.title}</option>`).join('');const b=document.createElement('div');b.className='modal-backdrop';b.innerHTML=AIC_SEC.sanitize(`<div class="modal"><h2>Council scoring</h2><label>Initiative<select id="ci">${opts}</select></label><label>Score<input id="cs" type="number" min="0" max="100" value="80"></label><label>Recommendation<select id="cr"><option>STRONG INVEST</option><option>INVEST</option><option>CONDITIONAL</option><option>NO INVEST</option></select></label><label>Justification<textarea id="cj"></textarea></label><button class="btn btn-success" id="saveCouncil">Submit</button></div>`);document.body.appendChild(b);b.onclick=e=>{if(e.target===b)b.remove()};saveCouncil.onclick=async()=>{const x=data.find(i=>i.id===ci.value),ok=/INVEST|CONDITIONAL/.test(cr.value);await AIC_DB.updateInitiative(ci.value,{councilScore:+cs.value,decision:cr.value,status:ok?'Approved':'Rejected',budgetApproved:ok?x.budgetRequested:0,stageRelease:ok?Math.round(x.budgetRequested*.04):0,councilJustification:cj.value});AIC_SEC.audit('COUNCIL_SCORE_SUBMITTED',{initiativeId:ci.value},'INFO');b.remove();showToast('Council decision saved','success');render()}}async function approveGate(id){const x=data.find(i=>i.id===id);if(await showConfirm('Approve Stage Gate','Release next stage funding?','Approve')){const gates=x.stageGates?.length?x.stageGates:[0,1,2,3].map(n=>({stage:'Stage '+n,budget:Math.round(x.budgetRequested*[.04,.30,.40,.26][n]),spent:0,status:n===0?'Active':'Locked',date:'TBD',exitCriteria:['Criteria']}));const next=gates.find(g=>g.status==='Locked')||gates.find(g=>g.status==='Active');if(next)next.status='Active';await AIC_DB.updateInitiative(id,{stageGates:gates,stageRelease:(x.stageRelease||0)+(next?.budget||0)});AIC_SEC.audit('STAGE_GATE_APPROVED',{initiativeId:id,stage:next?.stage},'INFO');render()}}initPage({allowedRoles:['Investment_Committee','Strategy_Reviewer','Platform_Admin'],onReady:render});</script></body></html>
