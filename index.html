<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><title>AIC Portal Login</title></head><body><div class="landing"><section class="hero"><span class="logo-mark">AIC</span><h1 style="font-size:46px">Alshaya Investment Council</h1><p style="font-size:20px;color:var(--color-muted)">One platform. Rigorous decisions.</p><div class="grid"><div class="card"><i class="fa-solid fa-shield-halved"></i> Secure governance from proposal to stage release</div><div class="card"><i class="fa-solid fa-chart-line"></i> Weighted gatekeeper and council scoring</div><div class="card"><i class="fa-solid fa-store"></i> Portfolio visibility across GCC retail brands</div></div></section><section class="login-panel"><div class="login-card"><h2>Sign in</h2><label>Email<input id="email" type="email" placeholder="name@alshaya.com"></label><button id="aad" class="btn btn-primary" style="width:100%;justify-content:center"><i class="fa-brands fa-microsoft"></i> Sign In with Azure AD</button><div class="divider">-- or sign in for demo --</div><label>Demo user<select id="demoUser"></select></label><div id="preview" class="card"></div><button id="demo" class="btn btn-success" style="width:100%;justify-content:center">Continue as Demo User</button></div></section></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script>'use strict';function route(u){return u.role==='Platform_Admin'?'admin.html':u.role==='Investment_Committee'?'cxo-dashboard.html':u.role==='Strategy_Reviewer'?'strategy-dashboard.html':u.role==='Portfolio_Viewer'?'cxo-dashboard.html':'initiator-dashboard.html'}async function boot(){const users=await AIC_DB.getUsers(),sel=document.getElementById('demoUser');let opts='';for(const role of [...new Set(users.map(u=>u.role))])opts+=`<optgroup label="${role}">`+users.filter(u=>u.role===role).map(u=>`<option value="${u.id}">${u.name} - ${u.title}</option>`).join('')+'</optgroup>';sel.innerHTML=AIC_SEC.sanitize(opts);function pv(){const u=users.find(x=>x.id===sel.value);preview.innerHTML=AIC_SEC.sanitize(`<div class="user-mini"><span class="avatar">${u.initials}</span><span><strong>${u.name}</strong><br><span class="badge badge-purple">${u.role}</span><br><small class="muted">${u.title}</small></span></div>`)}sel.onchange=pv;pv();aad.onclick=()=>AIC_AUTH.login();demo.onclick=()=>{const u=users.find(x=>x.id===sel.value);AIC_DB.setUser(u);AIC_SEC.createSession(u);AIC_SEC.safeRedirect(route(u))}}boot();</script></body></html>
