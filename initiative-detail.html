<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>Initiative Detail</title></head><body><nav class="sidebar"></nav><div class="main-wrap"><header class="top-bar"><h1 id="title">Initiative Detail</h1><div id="hdr"></div></header><main class="page-body"><section class="card"><div class="tabs" id="tabs"></div><div id="content"></div></section></main></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script> 'use strict';let x,user;const tabNames=['Overview','Shark Verdicts','Scorecard','Bear Case','Measurement Plan','Stage Gates','Score Entry'];function setTab(i=0){document.querySelectorAll('.tab').forEach((t,n)=>t.classList.toggle('active',n===i));const d=x.dimensions||{};if(i===0)content.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-2"><div><h2>${x.description||''}</h2><p>${x.problemStatement||''}</p><p>${x.proposedSolution||''}</p><h3>Customer evidence</h3><p>${x.customerEvidence||'-'}</p></div><div class="card"><h3>Financial Summary</h3><p>Requested ${formatCurrency(x.budgetRequested)}</p><p>Approved ${formatCurrency(x.budgetApproved)}</p><p>Spent ${formatCurrency(x.budgetSpent)}</p><p>Payback ${x.paybackMonths||'-'} months | IRR ${x.irr||'-'}% | NPV ${formatCurrency(x.npv||0)}</p><p><span class="badge badge-purple">${x.priority||''}</span></p></div></div>`);if(i===1)content.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-2">${(x.sharkVerdicts||[]).map(v=>`<div class="card shark-card"><h3>${v.icon||''} ${v.shark}</h3><span class="badge ${scoreClass(v.score)}">${v.score}</span> <span class="badge badge-info">${v.confidence}</span> <span class="badge ${decisionClass(v.recommendation)}">${v.recommendation}</span><p>${v.assessment}</p></div>`).join('')||'<p class="muted">No shark verdicts yet.</p>'}</div>`);if(i===2){content.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-2"><div class="chart-box"><canvas id="radar"></canvas></div><div><div class="score-ring ${x.gatekeeperScore>=75?'pass':x.gatekeeperScore>=60?'warn':'none'}">${x.gatekeeperScore??'--'}</div>${Object.values(d).map(v=>`<p>${v.name} (${v.weight}%) <span class="badge ${scoreClass(v.score)}">${v.score}</span></p><div class="progress"><span style="width:${v.score}%"></span></div>`).join('')}<h3>Council Score: ${x.councilScore??'Pending'}</h3></div></div>`);AIC_CHARTS.radar('radar',Object.values(d).map(v=>v.name),Object.values(d).map(v=>v.score))}if(i===3)content.innerHTML=AIC_SEC.sanitize(`<div class="card warning-card"><h2>Bear Case</h2><p>${x.bearCase||'No bear case recorded.'}</p></div><div class="card"><h3>Franchise Note</h3><p>${x.franchiseNote||'-'}</p><h3>Council Tension</h3><p>${x.councilTension||'-'}</p></div>`);if(i===4){const b=x.benefitsActuals||[];content.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-2"><div class="card"><h3>${x.measurementPlan?.primaryMetric||'Primary metric'}</h3><p>${x.measurementPlan?.baselineValue||'-'} -> ${x.measurementPlan?.targetValue||'-'}</p><p>${x.measurementPlan?.dataSource||''} | ${x.measurementPlan?.attributionMethod||''}</p><p>${x.measurementPlan?.accountableOwner||''}</p></div><div class="chart-box"><canvas id="benefits"></canvas></div></div><table><thead><tr><th>Period</th><th>Target</th><th>Actual</th><th>Status</th><th>Notes</th></tr></thead><tbody>${b.map(v=>`<tr><td>${v.period}</td><td>${v.target}</td><td>${v.actual}</td><td><span class="badge ${statusClass(v.status)}">${v.status}</span></td><td>${v.notes}</td></tr>`).join('')}</tbody></table>`);AIC_CHARTS.line('benefits',b.map(v=>v.period),[{label:'Target',data:b.map(v=>v.target),borderColor:'#6366f1'},{label:'Actual',data:b.map(v=>v.actual),borderColor:'#10b981'}])}if(i===5)content.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-4">${(x.stageGates||[]).map((g,n)=>`<div class="card stage-card"><h3>${g.stage}</h3><p>${formatCurrency(g.spent)} / ${formatCurrency(g.budget)}</p><div class="progress"><span style="width:${Math.min(100,(g.spent||0)/(g.budget||1)*100)}%"></span></div><p><span class="badge ${statusClass(g.status)}">${g.status}</span> ${g.date}</p><ul>${(g.exitCriteria||[]).map(c=>`<li>${c}</li>`).join('')}</ul>${user.canApprove||user.canAdmin?`<button class="btn btn-success" onclick="approveStage(${n})">Approve Stage Gate</button>`:''}</div>`).join('')}</div>`);if(i===6)content.innerHTML=AIC_SEC.sanitize(user.canApprove||user.canAdmin?`<label>Council score<input id="cc" type="number" min="0" max="100" value="${x.councilScore||80}"></label><label>Recommendation<select id="rr"><option>INVEST</option><option>CONDITIONAL</option><option>NO INVEST</option></select></label><label>Justification<textarea id="jj"></textarea></label><button class="btn btn-success" onclick="saveCouncil()">Submit council score</button>`:`<p class="muted">Council score: ${x.councilScore??'Pending'}</p>`)}async function approveStage(n){const gates=x.stageGates||[];gates[n].status='Complete';if(gates[n+1])gates[n+1].status='Active';await AIC_DB.updateInitiative(x.id,{stageGates:gates,stage:gates[n+1]?.stage||x.stage});AIC_SEC.audit('STAGE_GATE_APPROVED',{initiativeId:x.id,stage:gates[n].stage},'INFO');x=await AIC_DB.getInitiative(x.id);setTab(5)}async function saveCouncil(){await AIC_DB.updateInitiative(x.id,{councilScore:+cc.value,decision:rr.value,councilJustification:jj.value,status:rr.value==='NO INVEST'?'Rejected':'Approved',budgetApproved:x.budgetRequested,stageRelease:Math.round(x.budgetRequested*.04)});showToast('Council score saved','success');x=await AIC_DB.getInitiative(x.id);boot(user)}async function boot(u){user=u||user;x=await AIC_DB.getInitiative(getParam('id'));if(!x){content.innerHTML='Not found';return}title.textContent=x.title;hdr.innerHTML=AIC_SEC.sanitize(`<span class="badge badge-info">${x.id}</span> <span class="badge ${statusClass(x.status)}">${x.status}</span> <span class="badge ${decisionClass(x.decision)}">${x.decision||'Pending'}</span>`);tabs.innerHTML=AIC_SEC.sanitize(tabNames.map((t,i)=>`<button class="tab ${i===0?'active':''}" onclick="setTab(${i})">${t}</button>`).join(''));setTab(0)}initPage({allowedRoles:['authenticated'],onReady:boot});</script></body></html>
