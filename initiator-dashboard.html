<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>Submitter Dashboard</title></head><body><nav class="sidebar"></nav><div class="main-wrap"><header class="top-bar"><h1>Submitter Dashboard</h1><a class="btn btn-primary" href="submit-initiative.html"><i class="fa-solid fa-plus"></i> New Initiative</a></header><main class="page-body"><section class="grid grid-4" id="stats"></section><section class="card"><div class="tabs"><button class="tab active" data-tab="mine">My Initiatives</button><button class="tab" data-tab="drafts">Drafts</button><button class="tab" data-tab="benefits">Benefits Tracking</button></div><div id="tabBody"></div></section></main></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script> 'use strict';let user,items=[];function row(x){return`<tr onclick="location.href='initiative-detail.html?id=${encodeURIComponent(x.id)}'"><td><strong>${x.title}</strong><br><small class="muted">${x.id}</small></td><td>${x.domain}</td><td><span class="badge ${statusClass(x.status)}">${x.status}</span></td><td>${x.stage}</td><td>${formatDate(x.submittedDate)}</td><td>${formatCurrency(x.budgetRequested,'USD',true)}</td><td><span class="badge ${scoreClass(x.gatekeeperScore)}">${scoreLabel(x.gatekeeperScore)}</span></td><td><a class="btn btn-secondary" href="initiative-detail.html?id=${x.id}">View</a></td></tr>`}async function render(tab='mine'){items=await AIC_DB.getInitiatives(user.primaryRole==='Initiative_Submitter'?{submittedById:user.id}:{});const s={total:items.length,pending:items.filter(x=>/Submitted|Review/.test(x.status)).length,approved:items.filter(x=>/Approved|Closed|Validated/.test(x.status)).length,budget:items.reduce((n,x)=>n+(+x.budgetRequested||0),0)};stats.innerHTML=AIC_SEC.sanitize(`<div class="stat-card" style="--accent-color:var(--color-purple)"><div class="stat-label">My Initiatives</div><div class="stat-value">${s.total}</div></div><div class="stat-card" style="--accent-color:var(--color-warning)"><div class="stat-label">Pending Review</div><div class="stat-value">${s.pending}</div></div><div class="stat-card" style="--accent-color:var(--color-success)"><div class="stat-label">Approved</div><div class="stat-value">${s.approved}</div></div><div class="stat-card" style="--accent-color:var(--color-info)"><div class="stat-label">Total Budget Requested</div><div class="stat-value">${formatCurrency(s.budget,'USD',true)}</div></div>`);if(tab==='drafts'){const d=JSON.parse(localStorage.getItem('aic_db_drafts')||'[]');tabBody.innerHTML=AIC_SEC.sanitize(`<div class="grid grid-3">${d.map(x=>`<div class="card"><h3>${x.title||'Untitled draft'}</h3><p class="muted">Saved ${timeAgo(x.updatedAt)}</p><div class="progress"><span style="width:${x.completion||20}%"></span></div><br><button class="btn btn-primary" onclick="location.href='submit-initiative.html?draft=${x.id}'">Resume</button> <button class="btn btn-danger" onclick="AIC_DB.deleteDraft('${x.id}');render('drafts')">Delete</button></div>`).join('')||'<p class="muted">No drafts saved.</p>'}</div>`);return}if(tab==='benefits'){const b=items.flatMap(x=>(x.benefitsActuals||[]).map(v=>({...v,initiative:x.title})));tabBody.innerHTML=AIC_SEC.sanitize(`<div class="chart-box"><canvas id="benefitChart"></canvas></div><table><thead><tr><th>Initiative</th><th>Period</th><th>Metric</th><th>Target</th><th>Actual</th><th>Status</th></tr></thead><tbody>${b.map(v=>`<tr><td>${v.initiative}</td><td>${v.period}</td><td>${v.metric}</td><td>${v.target}</td><td>${v.actual}</td><td><span class="badge ${statusClass(v.status)}">${v.status}</span></td></tr>`).join('')}</tbody></table>`);AIC_CHARTS.line('benefitChart',b.map(x=>x.period),[{label:'Target',data:b.map(x=>x.target),borderColor:'#6366f1'},{label:'Actual',data:b.map(x=>x.actual),borderColor:'#10b981'}]);return}tabBody.innerHTML=AIC_SEC.sanitize(`<table><thead><tr><th>Title</th><th>Domain</th><th>Status</th><th>Stage</th><th>Date</th><th>Budget</th><th>GK Score</th><th>Actions</th></tr></thead><tbody>${items.map(row).join('')}</tbody></table>`)}document.addEventListener('click',e=>{if(e.target.matches('.tab')){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.tab)}});initPage({allowedRoles:['Initiative_Submitter','Strategy_Reviewer','Investment_Committee','Platform_Admin'],onReady:u=>{user=u;render()}});</script></body></html>
