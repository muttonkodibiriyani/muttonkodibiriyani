<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><title>Routing - AIC</title></head><body><div class="center-page"><div><span class="logo-mark">AIC</span><h1>Routing you to the right workspace...</h1><p id="msg" class="muted">Checking role assignment.</p></div></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script>'use strict';document.addEventListener('DOMContentLoaded',async()=>{const u=await AIC_AUTH.getCurrentUser();if(!u){location.href='index.html';return}const r=u.primaryRole||u.role,map={Platform_Admin:'admin.html',Investment_Committee:'cxo-dashboard.html',Strategy_Reviewer:'strategy-dashboard.html',Initiative_Submitter:'initiator-dashboard.html',Portfolio_Viewer:'cxo-dashboard.html'};if(map[r])location.href=map[r];else msg.textContent='No role assigned. Contact '+AIC_CONFIG.app.supportEmail;});</script></body></html>
