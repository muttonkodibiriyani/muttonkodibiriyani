<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Loading — Alshaya Investment Council</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/design-system.css" />
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
<div class="loading-overlay" style="position:relative;background:transparent;">
  <div class="spinner"></div>
  <div class="text-muted">Routing to your workspace…</div>
  <div id="err" class="text-danger" style="display:none; max-width:480px; text-align:center; margin-top:12px;"></div>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/security.js"></script>
<script src="js/auth.js"></script>
<script src="js/azure-api.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  try {
    let profile = AIC_AUTH.getCurrentUser();
    if (!profile) {
      profile = await AIC_AUTH.getProfile();
    }
    if (!profile) {
      window.location.replace('index.html');
      return;
    }
    const role = profile.primaryRole || profile.role;
    if (!role) {
      const e = document.getElementById('err');
      e.style.display = 'block';
      e.textContent = 'No role assigned. Contact aic-support@alshaya.com to request access.';
      return;
    }
    const route = ({
      'Platform_Admin':       'admin.html',
      'Investment_Committee': 'cxo-dashboard.html',
      'Strategy_Reviewer':    'strategy-dashboard.html',
      'Initiative_Submitter': 'initiator-dashboard.html'
    })[role] || 'index.html';
    window.location.replace(route);
  } catch (e) {
    console.error('[AIC Router]', e);
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = 'Routing failed: ' + e.message;
  }
})();
</script>
</body>
</html>
