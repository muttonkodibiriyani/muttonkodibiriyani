<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>Strategy Dashboard</title></head><body><nav class="sidebar"></nav><div class="main-wrap"><header class="top-bar"><h1>Strategy Reviewer Dashboard</h1><button class="btn btn-secondary" onclick="render()">Refresh</button></header><main class="page-body"><section class="grid grid-4" id="stats"></section><section class="card"><div class="tabs"><button class="tab active" data-tab="pending">Pending Review</button><button class="tab" data-tab="pipeline">Full Pipeline</button><button class="tab" data-tab="score">Score Entry</button><button class="tab" data-tab="insights">Portfolio Insights</button></div><div id="body"></div></section></main></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script> 'use strict';let data=[];function table(arr,scoreBtn=false){return`<table><thead><tr><th>Initiative</th><th>Domain</th><th>Status</th><th>Budget</th><th>Score</th><th></th></tr></thead><tbody>${arr.map(x=>`<tr><td>${x.title}<br><small class="muted">${x.id}</small></td><td>${x.domain}</td><td><span class="badge ${statusClass(x.status)}">${x.status}</span></td><td>${formatCurrency(x.budgetRequested,'USD',true)}</td><td>${x.gatekeeperScore??'-'}</td><td>${scoreBtn?`<button class="btn btn-primary" onclick="openScore('${x.id}')">Score</button>`:`<a class="btn btn-secondary" href="initiative-detail.html?id=${x.id}">View</a>`}</td></tr>`).join('')}</tbody></table>`}function scoreForm(id){const x=data.find(i=>i.id===id)||data.find(i=>i.status==='Submitted')||data[0];const d=x.dimensions&&Object.keys(x.dimensions).length?x.dimensions:{d1:{name:'Financial Return Credibility',score:70,weight:30},d2:{name:'Customer & Market Validity',score:70,weight:25},d3:{name:'Technical & Delivery Credibility',score:70,weight:20},d4:{name:'Strategic Alignment & Optionality',score:70,weight:15},d5:{name:'Operational & Risk Credibility',score:70,weight:10}};return`<div class="grid grid-2"><div><label>Select initiative<select id="scoreInit">${data.map(i=>`<option value="${i.id}" ${i.id===x.id?'selected':''}>${i.title}</option>`).join('')}</select></label>${Object.entries(d).map(([k,v])=>`<label>${v.name} (${v.weight}%) <input type="range" min="0" max="100" value="${v.score}" data-dim="${k}" data-name="${v.name}" data-weight="${v.weight}"><strong id="v-${k}">${v.score}</strong></label>`).join('')}<label>Justification<textarea id="just" required></textarea></label><label>Recommendation<select id="rec"><option>PASS</option><option>CONDITIONAL</option><option>RETURN</option><option>REJECT</option></select></label><label id="condWrap" class="hidden">Conditions<textarea id="conditions"></textarea></label><button class="btn btn-success" onclick="submitScore()">Submit Score</button></div><div class="card"><div id="ring" class="score-ring none">--</div><p id="scoreText" class="muted"></p></div></div>`}function calc(){const dims={};document.querySelectorAll('[data-dim]').forEach(r=>{document.getElementById('v-'+r.dataset.dim).textContent=r.value;dims[r.dataset.dim]={name:r.dataset.name,score:+r.value,weight:+r.dataset.weight}});const s=AIC_DB.computeGatekeeperScore(dims),ring=document.getElementById('ring');ring.className='score-ring '+(s>=75?'pass':s>=60?'warn':'fail');ring.textContent=s;scoreText.textContent=scoreLabel(s);return{dims,s}}async function submitScore(){if(!AIC_SEC.checkRateLimit('score',8,6e4))return showToast('Rate limit exceeded','error');if(!AIC_SEC.validate.text(just.value,{min:10}))return showToast('Justification required','error');const {dims,s}=calc(),rec=document.getElementById('rec').value;await AIC_DB.updateInitiative(scoreInit.value,{dimensions:dims,gatekeeperScore:s,status:rec==='PASS'||rec==='CONDITIONAL'?'Validated':'Submitted',stage:rec==='PASS'||rec==='CONDITIONAL'?'Awaiting Council':'Gatekeeper Review',decision:rec,gatekeeperJustification:just.value,conditions:conditions?.value||''});AIC_SEC.audit('SCORE_SUBMITTED',{initiativeId:scoreInit.value,score:s},'INFO');showToast('Gatekeeper score submitted','success');render('pending')}async function openScore(id){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab==='score'));render('score',id)}async function render(tab='pending',id){data=await AIC_DB.getInitiatives();const pending=data.filter(x=>x.status==='Submitted'),sum=await AIC_DB.getPortfolioSummary();stats.innerHTML=AIC_SEC.sanitize(`<div class="stat-card"><div class="stat-label">Pending My Review</div><div class="stat-value">${pending.length}</div></div><div class="stat-card"><div class="stat-label">Awaiting Council</div><div class="stat-value">${data.filter(x=>x.status==='Validated').length}</div></div><div class="stat-card"><div class="stat-label">Scored This Month</div><div class="stat-value">${data.filter(x=>x.gatekeeperScore).length}</div></div><div class="stat-card"><div class="stat-label">Avg Gatekeeper Score</div><div class="stat-value">${sum.avgGatekeeper}</div></div>`);if(tab==='pending')body.innerHTML=AIC_SEC.sanitize(table(pending,true));if(tab==='pipeline')body.innerHTML=AIC_SEC.sanitize(table(data));if(tab==='score'){body.innerHTML=AIC_SEC.sanitize(scoreForm(id));document.querySelectorAll('[data-dim]').forEach(r=>r.oninput=calc);scoreInit.onchange=()=>render('score',scoreInit.value);rec.onchange=()=>condWrap.classList.toggle('hidden',rec.value!=='CONDITIONAL');calc()}if(tab==='insights'){const by=data.reduce((m,x)=>((m[x.domain]=m[x.domain]||[]).push(x),m),{}),st=data.reduce((m,x)=>((m[x.status]=m[x.status]||[]).push(x),m),{});body.innerHTML=AIC_SEC.sanitize('<div class="grid grid-2"><div class="chart-box"><canvas id="domainChart"></canvas></div><div class="chart-box"><canvas id="funnelChart"></canvas></div></div><table><thead><tr><th>Domain</th><th>Avg score</th><th>Budget</th></tr></thead><tbody>'+Object.entries(by).map(([d,a])=>`<tr><td>${d}</td><td>${Math.round(a.reduce((n,x)=>n+(x.gatekeeperScore||0),0)/(a.length||1))}</td><td>${formatCurrency(a.reduce((n,x)=>n+x.budgetRequested,0),'USD',true)}</td></tr>`).join('')+'</tbody></table>');AIC_CHARTS.bar('domainChart',Object.keys(by),[{label:'Avg GK',data:Object.values(by).map(a=>Math.round(a.reduce((n,x)=>n+(x.gatekeeperScore||0),0)/a.length)),backgroundColor:'#6366f1'}]);AIC_CHARTS.bar('funnelChart',Object.keys(st),[{label:'Count',data:Object.values(st).map(a=>a.length),backgroundColor:'#10b981'}])}}document.addEventListener('click',e=>{if(e.target.matches('.tab')){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.tab)}});initPage({allowedRoles:['Strategy_Reviewer','Investment_Committee','Platform_Admin'],onReady:()=>render()});</script></body></html>
