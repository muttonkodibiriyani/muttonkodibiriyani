<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"><link rel="stylesheet" href="css/design-system.css"><script src="env-config.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script><script src="https://alcdn.msauth.net/browser/3.10.0/js/msal-browser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><title>Submit Initiative</title></head><body><nav class="sidebar"></nav><div class="main-wrap"><header class="top-bar"><h1>Submit New Initiative</h1><span id="stepText" class="badge badge-info"></span></header><main class="page-body"><div class="progress"><span id="bar"></span></div><section class="card"><div id="wizard"></div><div style="display:flex;justify-content:space-between;margin-top:16px"><button class="btn btn-secondary" id="back">Back</button><div><button class="btn btn-secondary" id="save">Save Draft</button><button class="btn btn-primary" id="next">Next</button></div></div></section></main></div><script src="js/config.js"></script><script src="js/db.js"></script><script src="js/security.js"></script><script src="js/auth.js"></script><script src="js/azure-api.js"></script><script src="js/app.js"></script><script> 'use strict';let step=0,user,form=AIC_DB.getDraft(getParam('draft'))||{};const steps=['Basic Information','Problem Statement','Proposed Solution','Financial Case','Measurement Plan','Risk & Bear Case','Stage Gate Plan','Review & Submit'];function field(n,l,t='text'){return`<label>${l}<${t==='textarea'?'textarea':'input'} ${t!=='textarea'?'type="'+t+'"':''} name="${n}" value="${form[n]||''}">${t==='textarea'?(form[n]||''):''}${t==='textarea'?'</textarea>':''}</label>`}function draw(){stepText.textContent=`Step ${step+1} of 8 - ${steps[step]}`;bar.style.width=((step+1)/8*100)+'%';let h='';if(step===0)h=field('title','Initiative Title')+'<label>Domain<select name="domain"><option>Retail Supply Chain</option><option>Ecommerce</option><option>In-Store Technology</option><option>Customer Loyalty</option><option>Pricing & Revenue</option><option>Digital Operations</option><option>HR & People</option><option>Other</option></select></label><label>Priority<select name="priority"><option>Strategic</option><option>Quick Win</option><option>Efficiency</option></select></label>'+field('sponsor','Sponsor Name + Title')+field('brands','Target Brands')+field('country','Target Countries/Markets')+field('startDate','Expected Start Date','date');if(step===1)h=field('problemStatement','Problem Description','textarea')+field('customerEvidence','Customer/Market Evidence','textarea')+field('costInaction','Current Cost of Inaction','number')+field('sizePrize','Size of Prize','number');if(step===2)h=field('proposedSolution','Solution Description','textarea')+'<label>Buy vs Build<select name="buyBuild"><option>Buy</option><option>Build</option><option>Hybrid</option></select></label>'+field('dependencies','Key Dependencies','textarea')+field('timeline','High-Level Timeline','textarea');if(step===3)h=field('budgetRequested','Total Budget Requested','number')+field('stage0','Stage 0 budget','number')+field('stage1','Stage 1 budget','number')+field('stage2','Stage 2 budget','number')+field('stage3','Stage 3 budget','number')+field('annualBenefit','Expected Annual Benefit','number')+field('paybackMonths','Payback Period months','number')+field('npv','Expected NPV','number')+field('irr','Expected IRR %','number')+'<p id="policy" class="badge badge-warning hidden">Payback exceeds 36 month policy</p>';if(step===4)h=field('primaryMetric','Primary KPI Name')+field('baselineValue','Baseline')+field('targetValue','Target')+field('secondaryMetrics','Secondary KPIs')+field('leadingIndicators','Leading Indicators','textarea')+field('dataSource','Data Source')+field('attributionMethod','Attribution Method','textarea')+field('accountableOwner','Accountable Owner')+field('reviewDates','First Review Date','date');if(step===5)h=[1,2,3].map(i=>field('risk'+i,'Risk '+i,'textarea')+field('risk'+i+'Likelihood','Likelihood 1-5','number')+field('risk'+i+'Impact','Impact 1-5','number')+field('risk'+i+'Mitigation','Mitigation','textarea')).join('')+field('bearCase','Bear Case Narrative','textarea')+field('franchiseNote','Franchise Note','textarea');if(step===6)h=[0,1,2,3].map(s=>`<h3>Stage ${s}</h3>${[1,2,3].map(i=>field(`stage${s}c${i}`,`Exit criteria ${i}`)).join('')}${field(`stage${s}date`,'Target date')}`).join('');if(step===7)h=`<div class="grid grid-2">${Object.entries(form).map(([k,v])=>`<div class="card"><strong>${k}</strong><p>${v}</p></div>`).join('')}</div><label><input type="checkbox" id="ack"> I acknowledge ${AIC_CONFIG.app.dataClassification} handling rules.</label>`;wizard.innerHTML=AIC_SEC.sanitize(h);wizard.querySelectorAll('input,textarea,select').forEach(el=>{el.onblur=saveLocal;el.oninput=()=>{if(el.name==='budgetRequested'){const b=+el.value||0;['stage0','stage1','stage2','stage3'].forEach((n,i)=>{const f=wizard.querySelector(`[name=${n}]`);if(f&&!f.value)f.value=Math.round(b*[.04,.30,.40,.26][i])})}if(el.name==='paybackMonths')document.getElementById('policy')?.classList.toggle('hidden',(+el.value||0)<=36)}});back.disabled=step===0;next.textContent=step===7?'Submit':'Next'}function saveLocal(){wizard.querySelectorAll('input,textarea,select').forEach(el=>{if(el.type!=='checkbox')form[el.name]=el.value});form.completion=Math.round((step+1)/8*100);AIC_DB.saveDraft(form)}save.onclick=()=>{saveLocal();showToast('Draft saved','success')};back.onclick=()=>{saveLocal();step--;draw()};next.onclick=async()=>{saveLocal();if(step<7){step++;draw();return}if(!ack.checked)return showToast('Acknowledge data classification','error');if(!AIC_SEC.validate.text(form.title,{min:3}))return showToast('Title required','error');if(!AIC_SEC.checkRateLimit('submit',5,6e4))return showToast('Submission rate limit exceeded','error');const budget=+form.budgetRequested||0,rec=await AIC_DB.createInitiative({title:form.title,domain:form.domain,status:'Submitted',stage:'Gatekeeper Review',sponsor:form.sponsor,submittedBy:user.name,submittedById:user.id,budgetRequested:budget,budgetApproved:0,budgetSpent:0,country:form.country,brands:String(form.brands||'').split(',').map(x=>x.trim()).filter(Boolean),priority:form.priority,description:form.proposedSolution||form.problemStatement,problemStatement:form.problemStatement,customerEvidence:form.customerEvidence,proposedSolution:form.proposedSolution,paybackMonths:+form.paybackMonths||0,npv:+form.npv||0,irr:+form.irr||0,dimensions:{},sharkVerdicts:[],measurementPlan:{primaryMetric:form.primaryMetric,baselineValue:form.baselineValue,targetValue:form.targetValue,secondaryMetrics:String(form.secondaryMetrics||'').split(','),leadingIndicators:form.leadingIndicators,dataSource:form.dataSource,attributionMethod:form.attributionMethod,accountableOwner:form.accountableOwner,reviewDates:form.reviewDates},bearCase:form.bearCase,franchiseNote:form.franchiseNote,stageGates:[0,1,2,3].map(i=>({stage:'Stage '+i,budget:+form['stage'+i]||Math.round(budget*[.04,.30,.40,.26][i]),spent:0,status:'Locked',date:form['stage'+i+'date']||'TBD',exitCriteria:[1,2,3].map(n=>form[`stage${i}c${n}`]).filter(Boolean)})),benefitsActuals:[],tags:[]});showToast(`Initiative ${rec.id} submitted for review`,'success');setTimeout(()=>location.href='initiator-dashboard.html',800)};initPage({allowedRoles:['Initiative_Submitter','Strategy_Reviewer','Investment_Committee','Platform_Admin'],onReady:u=>{user=u;draw()}});</script></body></html>
